name: Publish DailyCashPlan beta app

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-beta-app.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy tested beta app from feature branch
        run: |
          git fetch origin friendly-copy-beta-signup
          git show origin/friendly-copy-beta-signup:dailycashplan-app-v4.html > dailycashplan-app-v4.html

      - name: Point website buttons to beta app
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('href="dailycashplan-app.html"', 'href="dailycashplan-app-v4.html"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit live beta app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dailycashplan-app-v4.html index.html
          git diff --cached --quiet || git commit -m "Publish beta signup with Google Sheets connection"
          git push origin main
