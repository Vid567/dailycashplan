name: Validate DailyCashPlan production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4

      - name: Run existing tests
        run: npm test --if-present

      - name: Reject temporary release links
        run: |
          if grep -RIE --exclude-dir=.git --exclude-dir=.github --exclude=package-lock.json \
            'raw\.githack|rawgit|agent/artwork-design-system|friendly-copy-beta-signup' .; then
            echo "Temporary release reference found."
            exit 1
          fi

      - name: Verify production routes
        run: |
          test -f index.html
          test -f index-en.html
          test -f index-nl.html
          test -f index-es.html
          test -f index-es-us.html
          test -f index-fr.html
          test -f index-de.html
          test -f index-pt-br.html
          test -f index-zh-cn.html
          test -f dailycashplan-localized.html

          grep -q 'index-en.html' index.html
          grep -q 'index-nl.html' index.html
          grep -q 'index-es.html' index.html
          grep -q 'index-es-us.html' index.html
          grep -q 'index-fr.html' index.html
          grep -q 'index-de.html' index.html
          grep -q 'index-pt-br.html' index.html
          grep -q 'index-zh-cn.html' index.html

          grep -q 'dailycashplan-localized.html' index-en.html
          grep -q 'dailycashplan-localized.html' index-nl.html
          grep -q 'dailycashplan-localized.html' index-es.html

          grep -q 'G-28DSN28MXG' index.html
          grep -q 'G-28DSN28MXG' dailycashplan-localized.html
