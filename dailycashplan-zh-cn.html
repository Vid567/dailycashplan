<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DailyCashPlan</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#f2faf9}iframe{display:block}</style></head><body><iframe id="app" title="DailyCashPlan"></iframe><script>
const locale='zh-CN',currency='CNY';localStorage.setItem('dailyCashPlanLocale',locale);localStorage.setItem('dailyCashPlanCurrency',currency);const frame=document.getElementById('app');
const T=new Map([['Home','首页'],['On-device','仅保存在此设备'],['Add your income','添加收入'],['Income added','收入已添加'],['Expenses added','支出已添加'],['Debts added','债务已添加'],['Your full picture is ready','你的完整财务概览已准备好'],['A calmer money overview','更清晰、更轻松地了解你的财务状况'],['Stop wondering where your money went.','清楚了解你的钱花到哪里去了。'],['See your income, bills and debts on one clear page.','在一个清晰的页面中查看收入、支出和债务。'],['Start my own plan →','开始我的计划 →'],['Explore with sample numbers','使用示例数字查看'],['Help improve DailyCashPlan','帮助改进 DailyCashPlan'],['✓ Free beta access','✓ 免费测试版'],['✓ No account required','✓ 无需注册账户'],['✓ Your data stays on your device','✓ 数据保存在你的设备上'],['Join Free Beta','参加免费测试版'],['Overview','概览'],['Your money at a glance','你的财务概况'],['Income','收入'],['Expenses','支出'],['Available','可用金额'],['Total debt','债务总额'],['Join the Free Beta','参加免费测试版'],['Get early updates and help decide what we build next.','获取早期更新，并帮助我们决定下一步开发内容。'],['Clear this plan','清除此计划'],['Step 1','第 1 步'],['Money coming in','收入'],['＋ Add income','＋ 添加收入'],['Step 2','第 2 步'],['Money going out','支出'],['Fixed expenses','固定支出'],['＋ Add fixed expense','＋ 添加固定支出'],['Flexible expenses','可变支出'],['＋ Add flexible expense','＋ 添加可变支出'],['Step 3','第 3 步'],['What you owe','你的债务'],['Add the required minimum, then choose whether an extra payment is one-time or every month.','输入最低还款额，然后选择额外还款是一次性还是每月进行。'],['＋ Add a debt','＋ 添加债务'],['Your path','你的计划'],['Your payoff plan','债务偿还计划'],['See how extra payments can shorten your payoff time.','查看额外还款如何缩短债务偿还时间。'],['Plan','计划'],['Debts','债务'],['Not now','暂时不要'],['Save','保存'],['Free early beta','免费早期测试版'],['Join the first 50 beta users','成为前 50 名测试用户之一'],['Email address *','电子邮箱 *'],['First name','名字'],['Phone number','电话号码'],['Optional','可选'],['What is your biggest money struggle? *','你目前最大的财务困难是什么？ *'],['Choose one','请选择'],['Living paycheck to paycheck','每月收入几乎全部花完'],['Debt','债务'],['Overspending','支出过多'],['Budgeting','预算管理'],['Saving money','储蓄'],['Other','其他'],['Primary job','主要工作'],['Rent','房租'],['Utilities','水电及生活账单'],['Groceries','食品杂货'],['Credit card','信用卡'],['Nothing added yet.','尚未添加任何内容。'],['Edit','编辑'],['Edit entry','编辑项目'],['Name','名称'],['Balance','剩余债务'],['Interest rate %','利率 %'],['Required minimum payment','最低还款额'],['Extra payment type','额外还款类型'],['Every month','每月'],['One-time payment now','立即一次性还款'],['Extra payment amount','额外还款金额'],['Monthly amount','每月金额'],['＋ Add or change extra payment','＋ 添加或修改额外还款'],['Continue →','继续 →'],['Untitled','未命名'],['Saved','已保存'],['Payment too low','还款金额过低'],['Add a debt to see your payoff estimate.','添加债务后即可查看预计偿还时间。'],['Planned monthly debt payment','计划每月债务还款'],['What if you pay more every month?','如果每月多还一些会怎样？'],['Current plan','当前计划'],['Try another monthly amount','尝试其他每月还款金额'],['Calculate','计算'],['Required minimum','最低还款额'],['Recurring monthly extra','每月额外还款'],['Planned monthly payment','计划每月还款'],['Estimated payoff','预计偿还时间'],['Change extra payment','修改额外还款'],['Please enter a valid email address.','请输入有效的电子邮箱地址。'],['Please choose your biggest money struggle.','请选择你目前最大的财务困难。'],['You’re in! Welcome to the beta 🎉','报名成功！欢迎参加测试版 🎉'],['We could not save your signup. Please try again.','无法保存你的报名信息，请重试。'],['Remove all numbers stored on this device?','删除保存在此设备上的所有金额数据？']]);
const P=[['You earn ','你的收入为 '],[' and spend ','，支出为 '],[' may be available before debt payments.','，在偿还债务前可能还有可用金额。'],['Start with your income','先添加收入'],['Add your expenses','添加支出'],['Add your debts','添加债务'],['Review your payoff plan','查看债务偿还计划'],['Add income','添加收入'],['Add fixed','添加固定支出'],['Add variable','添加可变支出'],['Add debt','添加债务'],[' balance',' 剩余债务'],[' minimum',' 最低还款'],[' monthly extra',' 每月额外还款']];
function tr(v){if(v==null)return v;const raw=String(v),trim=raw.trim();if(T.has(trim))return raw.replace(trim,T.get(trim));let out=raw.replace(/^(\d+) month$/,'$1 个月').replace(/^(\d+) months$/,'$1 个月').replace(/^Another \+([^/]+)\/month$/,'每月再增加 $1').replace(/^Required minimum plus any recurring monthly extra\. Estimated payoff: (.+)\.$/,'最低还款额加上每月额外还款。预计偿还时间：$1。').replace(/^With another (.+) every month, estimated payoff is (.+)\.$/,'如果每月再增加 $1，预计偿还时间为 $2。');for(const [a,b] of P)out=out.split(a).join(b);return out;}
function translate(root){if(!root)return;const d=root.ownerDocument||root,w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}for(const el of root.querySelectorAll?.('[placeholder],[title],[aria-label]')||[])for(const a of ['placeholder','title','aria-label'])if(el.hasAttribute(a))el.setAttribute(a,tr(el.getAttribute(a)));}
async function load(){const r=await fetch('dailycashplan-app-v4.html?v=20260728-extra-types',{cache:'no-cache'});let html=await r.text();const fixed="new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2})",localized="new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',maximumFractionDigits:2})";if(!html.includes(fixed))console.warn('DailyCashPlan currency formatter signature not found');html=html.replace(fixed,localized);html=html.replace('<head>','<head><base href="'+new URL('.',location.href).href+'">');frame.srcdoc=html;}
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!d||!d.body)return;d.documentElement.lang='zh-CN';translate(d.body);try{const c=w.confirm.bind(w);w.confirm=m=>c(tr(m));const a=w.alert?.bind(w);if(a)w.alert=m=>a(tr(m));}catch(e){}const obs=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===3){const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}else if(n.nodeType===1)translate(n);}});obs.observe(d.body,{subtree:true,childList:true});setInterval(()=>translate(d.body),500);});load().catch(e=>{console.error(e);frame.src='dailycashplan-app-v4.html?v=20260728-extra-types';});
</script></body></html>
