<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DailyCashPlan</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#f2faf9}iframe{display:block}</style></head><body><iframe id="app" title="DailyCashPlan"></iframe><script>
const locale='pt-BR',currency='BRL';localStorage.setItem('dailyCashPlanLocale',locale);localStorage.setItem('dailyCashPlanCurrency',currency);const frame=document.getElementById('app');
const T=new Map([['Home','Início'],['On-device','Neste dispositivo'],['Add your income','Adicione sua renda'],['Income added','Renda adicionada'],['Expenses added','Despesas adicionadas'],['Debts added','Dívidas adicionadas'],['Your full picture is ready','Seu panorama completo está pronto'],['A calmer money overview','Uma visão mais tranquila do seu dinheiro'],['Stop wondering where your money went.','Entenda para onde seu dinheiro está indo.'],['See your income, bills and debts on one clear page.','Veja sua renda, despesas e dívidas em uma única página.'],['Start my own plan →','Começar meu plano →'],['Explore with sample numbers','Explorar com valores de exemplo'],['Help improve DailyCashPlan','Ajude a melhorar o DailyCashPlan'],['✓ Free beta access','✓ Acesso gratuito à Beta'],['✓ No account required','✓ Não precisa criar uma conta'],['✓ Your data stays on your device','✓ Seus dados ficam no seu dispositivo'],['Join Free Beta','Participar da Beta gratuita'],['Overview','Visão geral'],['Your money at a glance','Seu dinheiro em um relance'],['Income','Renda'],['Expenses','Despesas'],['Available','Disponível'],['Total debt','Dívida total'],['Join the Free Beta','Participar da Beta gratuita'],['Get early updates and help decide what we build next.','Receba novidades e ajude a decidir o que vamos desenvolver depois.'],['Clear this plan','Limpar este plano'],['Step 1','Etapa 1'],['Money coming in','Dinheiro que entra'],['＋ Add income','＋ Adicionar renda'],['Step 2','Etapa 2'],['Money going out','Dinheiro que sai'],['Fixed expenses','Despesas fixas'],['＋ Add fixed expense','＋ Adicionar despesa fixa'],['Flexible expenses','Despesas variáveis'],['＋ Add flexible expense','＋ Adicionar despesa variável'],['Step 3','Etapa 3'],['What you owe','O que você deve'],['Add the required minimum, then choose whether an extra payment is one-time or every month.','Adicione o pagamento mínimo obrigatório e escolha se o pagamento extra será único ou mensal.'],['＋ Add a debt','＋ Adicionar uma dívida'],['Your path','Seu caminho'],['Your payoff plan','Seu plano de quitação'],['See how extra payments can shorten your payoff time.','Veja como pagamentos extras podem reduzir o tempo para quitar suas dívidas.'],['Plan','Plano'],['Debts','Dívidas'],['Not now','Agora não'],['Save','Salvar'],['Free early beta','Beta antecipada gratuita'],['Join the first 50 beta users','Participe dos primeiros 50 usuários da Beta'],['Email address *','E-mail *'],['First name','Nome'],['Phone number','Telefone'],['Optional','Opcional'],['What is your biggest money struggle? *','Qual é sua maior dificuldade com dinheiro? *'],['Choose one','Escolha uma opção'],['Living paycheck to paycheck','Chegar ao fim do mês no limite'],['Debt','Dívidas'],['Overspending','Gastar demais'],['Budgeting','Organizar o orçamento'],['Saving money','Economizar dinheiro'],['Other','Outro'],['Primary job','Trabalho principal'],['Rent','Aluguel'],['Utilities','Contas da casa'],['Groceries','Supermercado'],['Credit card','Cartão de crédito'],['Nothing added yet.','Nada adicionado ainda.'],['Edit','Editar'],['Edit entry','Editar item'],['Name','Nome'],['Balance','Saldo devedor'],['Interest rate %','Taxa de juros %'],['Required minimum payment','Pagamento mínimo obrigatório'],['Extra payment type','Tipo de pagamento extra'],['Every month','Todo mês'],['One-time payment now','Pagamento único agora'],['Extra payment amount','Valor do pagamento extra'],['Monthly amount','Valor mensal'],['＋ Add or change extra payment','＋ Adicionar ou alterar pagamento extra'],['Continue →','Continuar →'],['Untitled','Sem nome'],['Saved','Salvo'],['Payment too low','Pagamento muito baixo'],['Add a debt to see your payoff estimate.','Adicione uma dívida para ver a estimativa de quitação.'],['Planned monthly debt payment','Pagamento mensal planejado das dívidas'],['What if you pay more every month?','E se você pagar mais todo mês?'],['Current plan','Plano atual'],['Try another monthly amount','Teste outro valor mensal'],['Calculate','Calcular'],['Required minimum','Mínimo obrigatório'],['Recurring monthly extra','Extra mensal recorrente'],['Planned monthly payment','Pagamento mensal planejado'],['Estimated payoff','Prazo estimado para quitação'],['Change extra payment','Alterar pagamento extra'],['Please enter a valid email address.','Digite um endereço de e-mail válido.'],['Please choose your biggest money struggle.','Escolha sua maior dificuldade com dinheiro.'],['You’re in! Welcome to the beta 🎉','Você entrou! Bem-vindo à Beta 🎉'],['We could not save your signup. Please try again.','Não foi possível salvar sua inscrição. Tente novamente.'],['Remove all numbers stored on this device?','Remover todos os valores salvos neste dispositivo?']]);
const P=[['You earn ','Você recebe '],[' and spend ',' e gasta '],[' may be available before debt payments.',' podem ficar disponíveis antes dos pagamentos das dívidas.'],['Start with your income','Comece pela sua renda'],['Add your expenses','Adicione suas despesas'],['Add your debts','Adicione suas dívidas'],['Review your payoff plan','Revise seu plano de quitação'],['Add income','Adicionar renda'],['Add fixed','Adicionar despesa fixa'],['Add variable','Adicionar despesa variável'],['Add debt','Adicionar uma dívida'],[' balance',' saldo devedor'],[' minimum',' mínimo'],[' monthly extra',' extra mensal']];
function tr(v){if(v==null)return v;const raw=String(v),trim=raw.trim();if(T.has(trim))return raw.replace(trim,T.get(trim));let out=raw.replace(/^(\d+) month$/,'$1 mês').replace(/^(\d+) months$/,'$1 meses').replace(/^Another \+([^/]+)\/month$/,'Mais +$1/mês').replace(/^Required minimum plus any recurring monthly extra\. Estimated payoff: (.+)\.$/,'Mínimo obrigatório mais qualquer extra mensal recorrente. Prazo estimado: $1.').replace(/^With another (.+) every month, estimated payoff is (.+)\.$/,'Com mais $1 por mês, o prazo estimado é $2.');for(const [a,b] of P)out=out.split(a).join(b);return out;}
function translate(root){if(!root)return;const d=root.ownerDocument||root,w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}for(const el of root.querySelectorAll?.('[placeholder],[title],[aria-label]')||[])for(const a of ['placeholder','title','aria-label'])if(el.hasAttribute(a))el.setAttribute(a,tr(el.getAttribute(a)));}
async function load(){const r=await fetch('dailycashplan-app-v4.html?v=20260728-extra-types',{cache:'no-cache'});let html=await r.text();const fixed="new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2})",localized="new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2})";if(!html.includes(fixed))console.warn('DailyCashPlan currency formatter signature not found');html=html.replace(fixed,localized);html=html.replace('<head>','<head><base href="'+new URL('.',location.href).href+'">');frame.srcdoc=html;}
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!d||!d.body)return;d.documentElement.lang='pt-BR';translate(d.body);try{const c=w.confirm.bind(w);w.confirm=m=>c(tr(m));const a=w.alert?.bind(w);if(a)w.alert=m=>a(tr(m));}catch(e){}const obs=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===3){const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}else if(n.nodeType===1)translate(n);}});obs.observe(d.body,{subtree:true,childList:true});setInterval(()=>translate(d.body),500);});load().catch(e=>{console.error(e);frame.src='dailycashplan-app-v4.html?v=20260728-extra-types';});
</script></body></html>
