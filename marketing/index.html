<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Content & Sales Engine</title><style>body{font-family:system-ui,sans-serif;max-width:1180px;margin:30px auto;padding:0 16px;background:#f6f7f9;color:#171717}h1{margin-bottom:4px}.sub,.muted{color:#666}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}select,button,input{padding:9px 12px;border:1px solid #bbb;border-radius:8px;background:white}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.stat{background:white;border:1px solid #ddd;border-radius:10px;padding:10px 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:15px}.pill{font-size:12px;background:#eee;border-radius:99px;padding:4px 8px;display:inline-block;margin:2px}.text{white-space:pre-wrap;margin:12px 0;font-size:14px}.count{font-size:12px}.ok{color:#087a2f}.warn{color:#a25b00}.toplink{float:right;font-size:13px}.workflow{background:#fff;border:1px solid #ddd;padding:12px 14px;border-radius:10px;margin:14px 0}.schedule{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.full{grid-column:1/-1}</style></head><body><a class="toplink" href="../">DailyCashPlan</a><h1>Content & Sales Engine</h1><p class="sub">Centrale contentbibliotheek en publicatieplanning voor DCP, PantryPlan, AI Stamp Scanner en AI Coin Scanner.</p><div class="workflow"><b>Workflow</b><br><span class="muted">EN: master → ready → scheduled → published · NL: ai-translated → human-reviewed → ready → scheduled → published</span></div><div class="bar"><select id="productFilter"><option value="all">Alle producten</option><option value="dcp">DailyCashPlan</option><option value="pp">PantryPlan</option><option value="stamp">AI Stamp Scanner</option><option value="coin">AI Coin Scanner</option></select><select id="langFilter"><option value="all">EN + NL</option><option value="en">EN</option><option value="nl">NL</option></select><select id="stateFilter"><option value="all">Alle statussen</option><option value="master">master</option><option value="ai-translated">ai-translated</option><option value="human-reviewed">human-reviewed</option><option value="ready">ready</option><option value="scheduled">scheduled</option><option value="published">published</option></select><button id="filterBtn" type="button">Filter</button><button id="exportVisible" type="button">Buffer CSV — zichtbaar</button><button id="exportScheduled" type="button">Buffer CSV — scheduled</button></div><div class="stats" id="stats"></div><div class="grid" id="grid"></div><script>
const DB_URL='https://raw.githubusercontent.com/Vid567/apps/main/marketing/content-database.json';let db={posts:[]};const productFilter=document.getElementById('productFilter'),langFilter=document.getElementById('langFilter'),stateFilter=document.getElementById('stateFilter'),statsEl=document.getElementById('stats'),gridEl=document.getElementById('grid');const k=(id,f)=>`cse:${id}:${f}`;function getState(p){return localStorage.getItem(k(p.id,'state'))||p.review_status}function setState(p,s){localStorage.setItem(k(p.id,'state'),s);render()}function plannedAt(p){return localStorage.getItem(k(p.id,'planned'))||''}function setPlanned(p,v){localStorage.setItem(k(p.id,'planned'),v)}function cleanText(p){return (p.language==='nl'&&['human-reviewed','ready','scheduled','published'].includes(getState(p)))?p.text.replace(/\n\n🤖 Vertaald met AI[^\n]*/,''):p.text}function copy(p){navigator.clipboard.writeText(cleanText(p))}function nextState(p){const s=getState(p);if(s==='ai-translated')return'human-reviewed';if(s==='human-reviewed'||s==='master')return'ready';if(s==='ready')return'scheduled';if(s==='scheduled')return'published';return s}function actionLabel(p){const s=getState(p);if(s==='ai-translated')return'✓ Taal gecontroleerd';if(s==='human-reviewed'||s==='master')return'✓ Klaar voor planning';if(s==='ready')return'✓ Markeer scheduled';if(s==='scheduled')return'✓ Markeer published';return'Published'}
async function init(){try{const r=await fetch(DB_URL,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);db=await r.json();render()}catch(e){gridEl.innerHTML=`<p>Database kon niet worden geladen: ${e.message}</p>`}}
function currentRows(){const pf=productFilter.value,lf=langFilter.value,sf=stateFilter.value;return (db.posts||[]).filter(p=>(pf==='all'||p.product_key===pf)&&(lf==='all'||p.language===lf)&&(sf==='all'||getState(p)===sf))}
function render(){const all=db.posts||[],rows=currentRows();const counts={};['master','ai-translated','human-reviewed','ready','scheduled','published'].forEach(s=>counts[s]=all.filter(p=>getState(p)===s).length);statsEl.innerHTML=`<div class="stat"><b>${all.length}</b><br><span class="muted">totaal</span></div><div class="stat"><b>${counts['human-reviewed']}</b><br><span class="muted">reviewed</span></div><div class="stat"><b>${counts.ready}</b><br><span class="muted">ready</span></div><div class="stat"><b>${counts.scheduled}</b><br><span class="muted">scheduled</span></div><div class="stat"><b>${counts.published}</b><br><span class="muted">published</span></div><div class="stat"><b>${rows.length}</b><br><span class="muted">zichtbaar</span></div>`;gridEl.innerHTML='';rows.forEach(p=>{const s=getState(p),el=document.createElement('article');el.className='card';el.innerHTML=`<span class="pill">${p.product}</span><span class="pill">${p.language.toUpperCase()}</span><span class="pill">Threads</span><span class="pill">${s}</span><div class="muted">${p.id} · ${p.theme}</div><div class="text"></div><div class="count ${cleanText(p).length<=500?'ok':'warn'}">${cleanText(p).length}/500 tekens</div><div class="schedule"><input class="dt full" type="datetime-local" value="${plannedAt(p)}"><button class="copy">Kopiëren</button><button class="advance">${actionLabel(p)}</button></div>`;el.querySelector('.text').textContent=cleanText(p);el.querySelector('.copy').onclick=()=>copy(p);el.querySelector('.dt').onchange=e=>setPlanned(p,e.target.value);el.querySelector('.advance').onclick=()=>{if(getState(p)==='ready'&&!plannedAt(p)){alert('Kies eerst een publicatiedatum en tijd.');return}setState(p,nextState(p))};gridEl.appendChild(el)})}
function csv(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function exportBuffer(onlyScheduled){let rows=onlyScheduled?(db.posts||[]).filter(p=>getState(p)==='scheduled'):currentRows().filter(p=>['ready','scheduled'].includes(getState(p)));if(!rows.length){alert('Geen ready/scheduled posts om te exporteren.');return}const out=[['Text','Posting Time'],...rows.map(p=>[cleanText(p),plannedAt(p)?plannedAt(p).replace('T',' '):''])].map(r=>r.map(csv).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out],{type:'text/csv;charset=utf-8'}));a.download=`buffer-threads-${onlyScheduled?'scheduled':'visible'}-${new Date().toISOString().slice(0,10)}.csv`;a.click()}
document.getElementById('filterBtn').addEventListener('click',render);document.getElementById('exportVisible').addEventListener('click',()=>exportBuffer(false));document.getElementById('exportScheduled').addEventListener('click',()=>exportBuffer(true));productFilter.addEventListener('change',render);langFilter.addEventListener('change',render);stateFilter.addEventListener('change',render);init();
</script></body></html>
