<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailyCashPlan Content Creator</title>
<style>
:root{--brand:#14365e;--brand-dark:#0e2948;--brand-light:#e7f2f8;--blue:#41b6e6;--success:#059669;--success-light:#d1fae5;--bg:#f6f8fb;--surface:#fff;--text:#1c1917;--muted:#78716c;--border:#dce5ed;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800;color:var(--brand)}.sub{color:var(--muted);font-size:14px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}select,input,textarea,button{font:inherit}select,input{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:#fff}.primary:hover{background:var(--brand-dark)}.secondary{background:var(--brand-light);color:var(--brand)}.ghost{background:#fff;border:1px solid var(--border)}.danger{color:var(--danger)}.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}.progress{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.progress strong{background:var(--brand-light);color:var(--brand);padding:8px 11px;border-radius:9px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.number{font-weight:800;color:var(--brand)}.theme{font-size:12px;background:var(--brand-light);color:var(--brand);padding:4px 8px;border-radius:999px}.post{white-space:pre-wrap;background:#fbfcfe;border:1px solid var(--border);border-radius:10px;padding:13px;min-height:255px;font-size:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:86px}.scheduled{box-shadow:inset 0 0 0 1px var(--blue)}.processed{border-color:var(--success);box-shadow:0 0 0 2px var(--success-light)}.processed .processed-btn{background:var(--success);color:#fff}.planner{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--border);padding:10px}th{color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:25px}.status-toggle{display:flex;align-items:center;gap:8px;min-height:43px;margin:0}.status-toggle input{width:auto}.notice{font-size:13px;color:var(--muted);margin-top:10px}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:11px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.post{min-height:auto}.grid{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="design-system.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="brand">💰 DailyCashPlan Content Creator</div><div class="sub">Generate, copy and plan your first Threads content series.</div></div>
    <a class="btn secondary" href="mvp-hub.html">My MVP Hub</a>
    <button class="btn secondary" onclick="downloadCSV()">Download CSV</button>
  </div>

  <div class="panel">
    <div class="controls">
      <div><label for="themeFilter">Theme</label><select id="themeFilter" onchange="renderPosts()"><option value="all">All themes</option><option>Where did my money go?</option><option>Bills & debt</option><option>Budget myths</option><option>Small wins</option><option>Peace of mind</option></select></div>
      <div><label for="count">Show posts</label><select id="count" onchange="renderPosts()"><option value="5">5</option><option value="10">10</option><option value="25">25</option><option value="50" selected>50</option></select></div>
      <div><label for="showProcessed">Post status</label><label class="status-toggle"><input id="showProcessed" type="checkbox" onchange="renderPosts()"> Show processed posts too</label></div>
    <div><label for="startDate">Planning start date</label><input id="startDate" type="date"></div>
      <div><label for="postsPerDay">Posts per day</label><select id="postsPerDay"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select></div>
      <button class="btn primary" onclick="autoPlan()">Auto-plan visible posts</button>
    </div>
    <div class="stats"><span id="postCount"></span><span id="plannedCount"></span><span>Default times: 08:00 · 12:30 · 18:00</span></div>
    <div class="progress"><strong id="processedCount"></strong><strong id="lastProcessed"></strong><strong id="nextPost"></strong></div>
    <div class="notice">Copy a post to Threads. After you have posted or scheduled it there, click ✓ Processed. This status is stored only in this browser.</div>
  </div>

  <div id="posts" class="grid"></div>

  <div class="panel planner">
    <div class="card-head"><h2 style="margin:0;font-size:20px">Planner</h2><button class="btn ghost danger" onclick="clearPlan()">Clear plan</button></div>
    <div id="planner"></div>
  </div>
</div>
<div id="toast" class="toast">Copied</div>
<script>
const link='https://vid567.github.io/apps/?product=dcp';
const posts=[
{theme:'Where did my money go?',hook:"Most people don't overspend.\nThey just don't know where their money went.",body:"A coffee here.\nA bill over there.\n\nOne clear overview\nchanges everything."},
{theme:'Where did my money go?',hook:'Money comes.\nMoney goes.\nWhere it disappears...\nnobody knows.',body:"Your money is not always gone.\nSometimes it is simply hidden\nin dozens of small payments."},
{theme:'Where did my money go?',hook:"Count what's spent.\nKnow where it went.",body:'Start with three numbers:\n\n→ income\n→ expenses\n→ debt\n\nClarity begins there.'},
{theme:'Where did my money go?',hook:'See your flow.\nThen you will know.',body:"You cannot change\nwhat you cannot see.\n\nPut the whole month\non one simple page."},
{theme:'Where did my money go?',hook:'Cash can hide.\nNumbers guide.',body:'Small purchases feel harmless.\nTogether, they tell a story.\n\nLook before you judge yourself.'},
{theme:'Bills & debt',hook:'Bills arrive.\nStress survives.',body:'Until you put every bill\nin one clear overview.\n\nKnowing the total\nis the first calm step.'},
{theme:'Bills & debt',hook:'Less debt.\nLess dread.',body:'Do not solve everything today.\n\nChoose one debt.\nChoose one next payment.\nChoose one small step.'},
{theme:'Bills & debt',hook:'Debt feels deep.\nTake one step, not one leap.',body:'You do not need a perfect plan.\nYou need a realistic next move\nyou can repeat.'},
{theme:'Bills & debt',hook:'Bills in sight.\nSleep better tonight.',body:'Write down what is due,\nhow much it costs\nand when it must be paid.\n\nUncertainty creates extra stress.'},
{theme:'Bills & debt',hook:'Know what you owe.\nThen choose where to go.',body:'List every debt without shame.\n\nThe list is not a verdict.\nIt is your starting point.'},
{theme:'Budget myths',hook:'A budget can bend.\nConfusion should end.',body:'A useful plan is not a prison.\n\nIt helps you decide\nbefore your money decides for you.'},
{theme:'Budget myths',hook:'Perfect is slow.\nStart with what you know.',body:'You do not need every receipt.\n\nBegin with your income,\nregular bills and total debt.'},
{theme:'Budget myths',hook:'More rules, more strain.\nKeep your money plan plain.',body:'Complicated systems are easy to quit.\n\nA simple overview\nyou actually use wins.'},
{theme:'Budget myths',hook:'No shame.\nJust name the game.',body:'A money overview is not about blame.\n\nIt is about seeing reality\nand choosing your next step.'},
{theme:'Budget myths',hook:'More earning is nice.\nKnowing is the real prize.',body:'A higher income can help.\n\nBut clarity helps at every income level.'},
{theme:'Small wins',hook:'Small today.\nBetter payday.',body:'Take two minutes:\n\n→ add your income\n→ add fixed bills\n→ add total debt\n\nThat is a real start.'},
{theme:'Small wins',hook:'One page.\nOne plan.\nYes, you can.',body:'Do not build a perfect budget.\n\nBuild one clear snapshot\nof where you stand today.'},
{theme:'Small wins',hook:'Track the facts.\nThen relax.',body:'Numbers feel less frightening\nwhen they are visible.\n\nOpen the overview.\nTake one action.'},
{theme:'Small wins',hook:'Save a little.\nStrengthen the middle.',body:'A tiny buffer is still a buffer.\n\nStart with an amount\nyou can repeat without stress.'},
{theme:'Small wins',hook:'Choose one move.\nFind your groove.',body:'Cancel one unused subscription.\nPlan one cheaper meal.\nPay one small extra amount.\n\nOne move counts.'},
{theme:'Peace of mind',hook:'Less guessing.\nLess stressing.',body:"Stop asking:\nCan I afford this?\n\nStart with a clear view\nof what remains after your bills."},
{theme:'Peace of mind',hook:'See it clear.\nControl is near.',body:'Financial calm does not begin\nwith having lots of money.\n\nIt begins with knowing\nwhere you stand.'},
{theme:'Peace of mind',hook:'Clear today.\nCalmer tomorrow.',body:'You cannot remove every worry.\n\nBut you can replace uncertainty\nwith one honest overview.'},
{theme:'Peace of mind',hook:'Know your flow.\nLet confidence grow.',body:'Every time you review your numbers,\nyou make the unknown smaller.\n\nThat is progress.'},
{theme:'Peace of mind',hook:'Money feels tight.\nClarity brings light.',body:'You are not your bank balance.\n\nSee the numbers.\nChoose the next step.\nKeep moving.'},
{theme:'Budget myths',hook:'Your budget may be failing before payday.',body:'→ Planning with best-case numbers\n→ Forgetting irregular costs\n→ Leaving no room for real life\n\nUse honest numbers, not hopeful ones.'},
{theme:'Bills & debt',hook:'Debt is a number, not a character test.',body:'→ List the balance\n→ Note the interest\n→ Pick the next payment\n\nFacts create options. Shame creates delay.'},
{theme:'Where did my money go?',hook:'A paycheck can disappear without one big purchase.',body:'Ten small decisions can do it.\n\nCheck what is already committed\nbefore deciding what is available.'},
{theme:'Small wins',hook:'Try this two-minute money reset today.',body:'→ Check your balance\n→ Review tomorrow’s bills\n→ Choose today’s spending limit\n\nSmall routines prevent big surprises.'},
{theme:'Peace of mind',hook:'Money anxiety loves unopened apps and envelopes.',body:'Avoiding the numbers brings short relief.\nSeeing them creates lasting calm.\n\nOpen one account today.\nWrite down only what is true.'},
{theme:'Small wins',hook:'An emergency fund does not need a dramatic start.',body:'Save the first amount you can repeat.\n\n→ €5 is a beginning\n→ Consistency builds the buffer\n→ The buffer buys breathing room'},
{theme:'Where did my money go?',hook:'One forgotten subscription is small. Five are a leak.',body:'Open your last bank statement.\nCircle every recurring payment.\n\nKeep what earns its place.\nCancel what you no longer notice.'},
{theme:'Small wins',hook:'Impulse buying starts before the checkout.',body:'Add a 24-hour pause for non-essentials.\n\n→ Save the item\n→ Leave the page\n→ Decide tomorrow\n\nDistance makes the decision clearer.'},
{theme:'Where did my money go?',hook:'Your grocery budget needs a plan for tired days.',body:'Perfect meal plans often fail at 6 p.m.\n\nKeep two cheap, easy meals ready.\nConvenience planned at home\ncosts less than emergency takeout.'},
{theme:'Small wins',hook:'A no-spend day is useful data, not punishment.',body:'Notice what made spending easier to avoid.\n\n→ Fewer shopping apps\n→ Food prepared ahead\n→ A clear daily limit\n\nRepeat what worked.'},
{theme:'Bills & debt',hook:'Paying only the card minimum has a hidden cost.',body:'The balance stays longer.\nInterest gets more time.\n\nKnow the minimum, interest rate\nand one realistic extra amount.'},
{theme:'Budget myths',hook:'Myth: a realistic budget cuts out every treat.',body:'A plan with zero breathing room\nis easy to abandon.\n\nGive enjoyable spending a limit.\nThen enjoy it without guessing.'},
{theme:'Where did my money go?',hook:'Monthly planning should begin before the month does.',body:'Look ahead for costs that do not repeat weekly.\n\n→ Birthdays\n→ Annual renewals\n→ School or travel costs\n\nExpected expenses are easier to handle.'},
{theme:'Peace of mind',hook:'Financial overwhelm often means too many open loops.',body:'Bills, debts and due dates\nare competing for attention.\n\nPut them in one place.\nYour brain should not be the filing system.'},
{theme:'Budget myths',hook:'You do not need 20 spending categories.',body:'Start with what helps you decide:\n\n→ Money coming in\n→ Bills and essentials\n→ Flexible spending\n→ Debt and savings'},
{theme:'Peace of mind',hook:'Confidence comes after small money actions.',body:'Not before them.\n\nReview one number.\nMake one choice.\nRepeat tomorrow.\nThat is how trust in yourself grows.'},
{theme:'Where did my money go?',hook:'Tracking every expense is useless if you never review it.',body:'Once a week, ask:\n\n→ What surprised me?\n→ What can change next week?\n→ What went well?\n\nTracking should guide decisions.'},
{theme:'Bills & debt',hook:'Overdrafts are often timing problems.',body:'Income may arrive after bills leave.\n\nPut payday and due dates together.\nThen move a due date or reserve cash\nbefore the expensive gap appears.'},
{theme:'Small wins',hook:'Before payday, give the next paycheck three jobs.',body:'→ Cover essentials\n→ Handle priority debt\n→ Protect a small buffer\n\nDecide before the money arrives.\nPayday becomes calmer.'},
{theme:'Peace of mind',hook:'A bad spending day does not ruin the month.',body:'Do not wait for Monday or next month.\n\nCheck what remains.\nAdjust one category.\nContinue with the next decision.'},
{theme:'Budget myths',hook:'Saving what is left rarely works.',body:'There is often nothing left by accident.\n\nChoose a small amount first.\nTreat it like a bill.\nIncrease it only when the habit feels stable.'},
{theme:'Where did my money go?',hook:'Before: Can I afford this today?',body:'After: Can I afford this\nafter bills, debt and tomorrow’s needs?\n\nOne better question\ncan prevent a week of stress.'},
{theme:'Small wins',hook:'Try a Sunday 10-minute money check-in.',body:'→ Review the week\n→ Check upcoming bills\n→ Set one spending target\n→ Plan one small win\n\nStop when the timer ends.'},
{theme:'Bills & debt',hook:'Extra debt payments should not create new debt.',body:'Keep enough for essentials\nand a small surprise.\n\nA slower payment you can sustain\nbeats a heroic payment you must undo.'},
{theme:'Peace of mind',hook:'One page can be enough for a money plan.',body:'If it shows what comes in,\nwhat must go out\nand what remains,\nyou can make the next decision\nwithout rebuilding your whole life.'}
].map((p,i)=>({...p,id:i+1,text:i<25?`${p.hook}\n\n${p.body}\n\nTry it free 👇\n${link}\n\nDM me with your feedback.`:`${p.hook}\n\n${p.body}\n\nTry DailyCashPlan free:\nhttps://vid567.github.io/apps/?product=dcp\n\nDM me with your feedback.`}));
let plan=JSON.parse(localStorage.getItem('dcpContentPlan')||'{}');
let processed=JSON.parse(localStorage.getItem('dcpContentProcessedV1')||'{}');
const processedIds=Object.keys(processed);if(!processedIds.length||(processedIds.length===1&&processedIds[0]==='50')){processed={};const restoredAt=new Date().toISOString();for(let id=1;id<=25;id++)processed[id]=restoredAt;localStorage.setItem('dcpContentProcessedV1',JSON.stringify(processed))}
function visiblePosts(){const theme=document.getElementById('themeFilter').value;const count=Number(document.getElementById('count').value);const showProcessed=document.getElementById('showProcessed').checked;return posts.filter(p=>(theme==='all'||p.theme===theme)&&(showProcessed||!processed[p.id])).slice(0,count)}
function renderPosts(){const list=visiblePosts();document.getElementById('posts').innerHTML=list.map(p=>`<article id="post-${p.id}" class="card ${plan[p.id]?'scheduled':''} ${processed[p.id]?'processed':''}"><div class="card-head"><span class="number">Post ${p.id}</span><span class="theme">${p.theme}</span></div><div class="post">${escapeHtml(p.text)}</div><div class="actions"><button class="btn primary" onclick="copyPost(${p.id})">Copy</button><button class="btn secondary" onclick="planOne(${p.id})">${plan[p.id]?'Change time':'Plan'}</button>${processed[p.id]?`<button class="btn ghost processed-btn" onclick="toggleProcessed(${p.id})">✓ Processed</button>`:''}</div></article>`).join('');document.getElementById('postCount').textContent=`${list.length} posts shown`;renderPlanner();renderProgress()}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function copyPost(id){await navigator.clipboard.writeText(posts.find(p=>p.id===id).text);if(!processed[id]){processed[id]=new Date().toISOString();localStorage.setItem('dcpContentProcessedV1',JSON.stringify(processed));renderPosts()}toast('Copied and marked as processed')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function toggleProcessed(id){if(processed[id])delete processed[id];else processed[id]=new Date().toISOString();localStorage.setItem('dcpContentProcessedV1',JSON.stringify(processed));renderPosts();toast(processed[id]?'Marked as processed':'Marked as not processed')}
function renderProgress(){const done=posts.filter(p=>processed[p.id]);document.getElementById('processedCount').textContent=`${done.length} of ${posts.length} processed`;const last=done.slice().sort((a,b)=>String(processed[b.id]).localeCompare(String(processed[a.id])))[0];document.getElementById('lastProcessed').textContent=last?`Last processed: Post ${last.id}`:'Last processed: none';const next=posts.find(p=>!processed[p.id]);document.getElementById('nextPost').textContent=next?`Next: Post ${next.id}`:'All posts processed ✓'}
function planOne(id){const existing=plan[id]||'';const value=prompt('Enter date and time (YYYY-MM-DD HH:MM)',existing);if(!value)return;plan[id]=value;savePlan();renderPosts()}
function autoPlan(){const start=document.getElementById('startDate').value;if(!start){alert('Choose a planning start date first.');return}const perDay=Number(document.getElementById('postsPerDay').value);const times=['08:00','12:30','18:00'];visiblePosts().forEach((p,index)=>{const day=new Date(start+'T12:00:00');day.setDate(day.getDate()+Math.floor(index/perDay));const y=day.getFullYear(),m=String(day.getMonth()+1).padStart(2,'0'),d=String(day.getDate()).padStart(2,'0');plan[p.id]=`${y}-${m}-${d} ${times[index%perDay]}`});savePlan();renderPosts();toast('Planning created')}
function savePlan(){localStorage.setItem('dcpContentPlan',JSON.stringify(plan))}
function clearPlan(){if(confirm('Clear the complete content plan?')){plan={};savePlan();renderPosts()}}
function renderPlanner(){const rows=posts.filter(p=>plan[p.id]).sort((a,b)=>plan[a.id].localeCompare(plan[b.id]));document.getElementById('plannedCount').textContent=`${rows.length} planned`;document.getElementById('planner').innerHTML=rows.length?`<table><thead><tr><th>Date & time</th><th>Post</th><th>Hook</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${plan[p.id]}</td><td>${p.id}</td><td>${escapeHtml(p.hook.replaceAll('\n',' / '))}</td><td><button class="btn ghost" onclick="copyPost(${p.id})">Copy</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No posts planned yet.</div>'}
function downloadCSV(){const rows=[['Post','Theme','Hook','Full post','Planned date/time','Processed'],...posts.map(p=>[p.id,p.theme,p.hook,p.text,plan[p.id]||'',processed[p.id]?'Yes':'No'])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='DailyCashPlan-Threads-50-posts.csv';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('startDate').value=new Date(Date.now()+86400000).toISOString().slice(0,10);renderPosts();
</script>
</body>
</html>
