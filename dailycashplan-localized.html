function nlText(value){
 if(!isNL||value==null)return value;
 const raw=String(value), trimmed=raw.trim();
 if(NL_EXACT.has(trimmed))return raw.replace(trimmed,NL_EXACT.get(trimmed));
 let out=raw; for(const [a,b] of NL_PHRASES)out=out.split(a).join(b);
 return out;
}
function translateNode(root){
 if(!isNL||!root)return;
 const doc=root.ownerDocument||root;
 const walker=doc.createTreeWalker(root,NodeFilter.SHOW_TEXT); const nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 for(const n of nodes){if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const t=nlText(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}
 for(const el of root.querySelectorAll?.('[placeholder],[title],[aria-label]')||[])for(const a of ['placeholder','title','aria-label'])if(el.hasAttribute(a))el.setAttribute(a,nlText(el.getAttribute(a)));
}
async function loadLocalizedApp(){
 const response=await fetch('dailycashplan-app-v4.html?v=20260728-extra-types',{cache:'no-cache'});
 let html=await response.text();
 const fixed="new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2})";
 const localized=`new Intl.NumberFormat(${JSON.stringify(locale)},{style:'currency',currency:${JSON.stringify(currency)},maximumFractionDigits:2})`;
 if(!html.includes(fixed)) console.warn('DailyCashPlan currency formatter signature not found');
 html=html.replace(fixed,localized);
 const base='<base href="'+new URL('.',location.href).href+'">';
 html=html.replace('<head>','<head>'+base);
 frame.srcdoc=html;
}
frame.addEventListener('load',()=>{
 const w=frame.contentWindow,d=frame.contentDocument;
 if(!d||!d.body)return;
 if(isNL){
   d.documentElement.lang='nl'; translateNode(d.body);
   try{const originalConfirm=w.confirm.bind(w);w.confirm=msg=>originalConfirm(nlText(msg));const originalAlert=w.alert?.bind(w);if(originalAlert)w.alert=msg=>originalAlert(nlText(msg));}catch(e){}
   const obs=new MutationObserver(muts=>{for(const m of muts)for(const n of m.addedNodes){if(n.nodeType===Node.TEXT_NODE){const t=nlText(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}else if(n.nodeType===Node.ELEMENT_NODE)translateNode(n);}});
   obs.observe(d.body,{subtree:true,childList:true});
   setInterval(()=>translateNode(d.body),1000);
 }
});
loadLocalizedApp().catch(err=>{console.error(err);frame.src='dailycashplan-app-v4.html?v=20260728-extra-types';});
