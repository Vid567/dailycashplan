function compose(p){return `${p[1]}\n\nProbeer DailyCashPlan gratis 👇\n${URL}\n\n${AI}`};const posts=raw.map((p,i)=>({id:`DCP-${String(i+1).padStart(3,'0')}-nl`,theme:p[0],text:compose(p)}));const root=document.getElementById('posts');posts.forEach(p=>{const el=document.createElement('article');el.className='post';el.innerHTML=`<div class="meta">${p.id} · ${p.theme}</div><div class="text"></div><div class="count ${p.text.length>500?'over':''}">${p.text.length}/500</div><button>Kopiëren</button>`;el.querySelector('.text').textContent=p.text;el.querySelector('button').onclick=()=>navigator.clipboard.writeText(p.text);root.appendChild(el)});function copyAll(){navigator.clipboard.writeText(posts.map(p=>`${p.id}\n${p.text}`).join('\n\n---\n\n'))}function downloadCsv(){const q=v=>'"'+String(v).replaceAll('"','""')+'"';const csv='\ufeff'+[['id','theme','text'],...posts.map(p=>[p.id,p.theme,p.text])].map(r=>r.map(q).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='dailycashplan-content-nl.csv';a.click()}if(posts.length!==50||posts.some(p=>p.text.length>500)||posts.some(p=>!p.text.includes('Vertaald met AI')))throw new Error('Content QA failed');
