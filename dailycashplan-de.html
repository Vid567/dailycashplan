function tr(v){if(v==null)return v;const raw=String(v),trim=raw.trim();if(T.has(trim))return raw.replace(trim,T.get(trim));let out=raw.replace(/^(\d+) month$/,'$1 Monat').replace(/^(\d+) months$/,'$1 Monate').replace(/^Another \+([^/]+)\/month$/,'Weitere +$1/Monat').replace(/^Required minimum plus any recurring monthly extra\. Estimated payoff: (.+)\.$/,'Erforderliches Minimum plus wiederkehrende monatliche Extra-Zahlung. Geschätzte Tilgungsdauer: $1.').replace(/^With another (.+) every month, estimated payoff is (.+)\.$/,'Mit weiteren $1 pro Monat beträgt die geschätzte Tilgungsdauer $2.');for(const [a,b] of P)out=out.split(a).join(b);return out;}
function translate(root){if(!root)return;const d=root.ownerDocument||root,w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}for(const el of root.querySelectorAll?.('[placeholder],[title],[aria-label]')||[])for(const a of ['placeholder','title','aria-label'])if(el.hasAttribute(a))el.setAttribute(a,tr(el.getAttribute(a)));}
async function load(){const r=await fetch('dailycashplan-app-v4.html?v=20260728-extra-types',{cache:'no-cache'});let html=await r.text();const fixed="new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2})",localized="new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:2})";if(!html.includes(fixed))console.warn('DailyCashPlan currency formatter signature not found');html=html.replace(fixed,localized);html=html.replace('<head>','<head><base href="'+new URL('.',location.href).href+'">');frame.srcdoc=html;}
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!d||!d.body)return;d.documentElement.lang='de';translate(d.body);try{const c=w.confirm.bind(w);w.confirm=m=>c(tr(m));const a=w.alert?.bind(w);if(a)w.alert=m=>a(tr(m));}catch(e){}const obs=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===3){const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;}else if(n.nodeType===1)translate(n);}});obs.observe(d.body,{subtree:true,childList:true});setInterval(()=>translate(d.body),500);});load().catch(e=>{console.error(e);frame.src='dailycashplan-app-v4.html?v=20260728-extra-types';});
